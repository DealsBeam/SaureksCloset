name: Addon regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.1 python3-pil
      - name: Prepare bundled renderer verification
        run: cp 'addon/SaureksCloset/Installation instructions/SaureksCloset.dll' native/SaureksCloset.dll
      - name: Run release regression checks
        run: /usr/bin/python3 tools/check_release.py
